---
# Bootstrap AAP objects so sync_marker_team_roles.yml can run on the platform
# (LDAP credential type/credential, inventory, public Git project, JT, schedule).
#
# Secrets: copy vars/secrets.yml.example → vars/secrets.yml, fill values, encrypt.
# Job template attaches:
#   - Vault credential → decrypt vars/secrets.yml
#   - AAP API credential → CONTROLLER_* for platform API calls
#   - LDAP Active Directory credential → GE_LDAP_* for AD checks

- name: Bootstrap AAP runner for Global Executor role sync
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/secrets.yml

  vars:
    ge_organization: "Global Operations"
    ge_inventory_name: "Global Executor Inventory"
    ge_project_name: "Global Executor"
    ge_job_template_name: "Sync Marker Team Roles"
    ge_schedule_name: "Sync Marker Team Roles hourly"
    ge_playbook: "sync_marker_team_roles.yml"

    # Optional overrides live in vars/secrets.yml (see secrets.yml.example):
    #   project_scm_url, project_scm_branch, ge_vault_credential,
    #   ge_aap_api_credential, ge_execution_environment, ge_ldap_credential,
    #   ge_ldap_credential_type, vault_ldap_*

    aap_hostname: "{{ vault_aap_hostname }}"
    aap_username: "{{ vault_aap_username }}"
    aap_password: "{{ vault_aap_password }}"
    aap_validate_certs: "{{ vault_aap_validate_certs }}"
    gateway_hostname: "{{ aap_hostname }}"
    gateway_username: "{{ aap_username }}"
    gateway_password: "{{ aap_password }}"
    gateway_validate_certs: "{{ aap_validate_certs }}"
    aap_configuration_async_dir: /tmp/ansible-async-ge

  tasks:
    - name: Apply bootstrap defaults when not set in vars/secrets.yml
      ansible.builtin.set_fact:
        project_scm_url: "{{ project_scm_url | default('https://github.com/EXAMPLE_ORG/aap-global-executor.git') }}"
        project_scm_branch: "{{ project_scm_branch | default('main') }}"
        ge_vault_credential: "{{ ge_vault_credential | default('CHANGE_ME_VAULT_CREDENTIAL') }}"
        ge_aap_api_credential: "{{ ge_aap_api_credential | default('CHANGE_ME_AAP_API_CREDENTIAL') }}"
        ge_execution_environment: "{{ ge_execution_environment | default('CHANGE_ME_EE') }}"
        ge_ldap_credential: "{{ ge_ldap_credential | default('Global Executor LDAP') }}"
        ge_ldap_credential_type: "{{ ge_ldap_credential_type | default('LDAP Active Directory') }}"
        vault_ldap_validate_certs: "{{ vault_ldap_validate_certs | default(false) }}"

    # No built-in AAP credential type injects LDAP bind settings for playbooks.
    # Create a custom type that injects GE_LDAP_* environment variables.
    - name: Define LDAP Active Directory credential type
      ansible.builtin.set_fact:
        controller_credential_types:
          - name: "{{ ge_ldap_credential_type }}"
            description: "LDAP/AD bind settings for Global Executor AD account checks"
            kind: cloud
            inputs:
              fields:
                - id: ldap_server
                  type: string
                  label: LDAP Server URI
                  help_text: "e.g. ldaps://dc.example.com:636"
                - id: ldap_bind_dn
                  type: string
                  label: Bind DN
                - id: ldap_bind_password
                  type: string
                  label: Bind Password
                  secret: true
                - id: ldap_search_base
                  type: string
                  label: Search Base
                  help_text: "e.g. DC=example,DC=com"
                - id: ldap_validate_certs
                  type: string
                  label: Validate TLS Certificates
                  help_text: "true or false"
              required:
                - ldap_server
                - ldap_bind_dn
                - ldap_bind_password
                - ldap_search_base
            injectors:
              env:
                GE_LDAP_SERVER: "{{ '{{' }} ldap_server {{ '}}' }}"
                GE_LDAP_BIND_DN: "{{ '{{' }} ldap_bind_dn {{ '}}' }}"
                GE_LDAP_BIND_PASSWORD: "{{ '{{' }} ldap_bind_password {{ '}}' }}"
                GE_LDAP_SEARCH_BASE: "{{ '{{' }} ldap_search_base {{ '}}' }}"
                GE_LDAP_VALIDATE_CERTS: "{{ '{{' }} ldap_validate_certs {{ '}}' }}"

    - name: Define LDAP credential when vault LDAP vars are present
      ansible.builtin.set_fact:
        controller_credentials:
          - name: "{{ ge_ldap_credential }}"
            description: "LDAP bind used by Sync Marker Team Roles for AD validation"
            credential_type: "{{ ge_ldap_credential_type }}"
            organization: "{{ ge_organization }}"
            inputs:
              ldap_server: "{{ vault_ldap_server }}"
              ldap_bind_dn: "{{ vault_ldap_bind_dn }}"
              ldap_bind_password: "{{ vault_ldap_bind_password }}"
              ldap_search_base: "{{ vault_ldap_search_base }}"
              ldap_validate_certs: "{{ vault_ldap_validate_certs | default(false) | string }}"
      when:
        - vault_ldap_server is defined
        - vault_ldap_bind_dn is defined
        - vault_ldap_bind_password is defined
        - vault_ldap_search_base is defined

    - name: Define inventory in memory
      ansible.builtin.set_fact:
        controller_inventories:
          - name: "{{ ge_inventory_name }}"
            organization: "{{ ge_organization }}"
            description: "Local inventory used to run Global Executor sync jobs"

    - name: Define localhost host in memory
      ansible.builtin.set_fact:
        controller_hosts:
          - name: localhost
            inventory: "{{ ge_inventory_name }}"
            description: "Control node target for API-only Global Executor playbooks"
            variables:
              ansible_connection: local
              ansible_python_interpreter: "{{ '{{' }} ansible_playbook_python {{ '}}' }}"

    - name: Define project in memory
      ansible.builtin.set_fact:
        controller_projects:
          - name: "{{ ge_project_name }}"
            description: "Source for {{ ge_playbook }} (public GitHub repo)"
            organization: "{{ ge_organization }}"
            scm_type: git
            scm_url: "{{ project_scm_url }}"
            scm_branch: "{{ project_scm_branch }}"
            scm_clean: true
            scm_delete_on_update: false
            scm_update_on_launch: true
            scm_update_cache_timeout: 0
            allow_override: true
            update_project: true

    - name: Define job template in memory
      ansible.builtin.set_fact:
        controller_templates:
          - name: "{{ ge_job_template_name }}"
            description: >-
              Sync Organization Execute for GE_EXECUTOR_USERS after AD account
              validation (exists, enabled, password not expired)
            organization: "{{ ge_organization }}"
            project: "{{ ge_project_name }}"
            playbook: "{{ ge_playbook }}"
            inventory: "{{ ge_inventory_name }}"
            credentials: "{{ [ge_vault_credential, ge_aap_api_credential] + ([ge_ldap_credential] if (controller_credentials is defined) else []) }}"
            execution_environment: "{{ ge_execution_environment }}"
            job_type: run
            ask_credential_on_launch: false
            ask_inventory_on_launch: false
            ask_variables_on_launch: false
            verbosity: 0

    - name: Define hourly schedule in memory
      ansible.builtin.set_fact:
        controller_schedules:
          - name: "{{ ge_schedule_name }}"
            description: "Run Sync Marker Team Roles every hour"
            unified_job_template: "{{ ge_job_template_name }}"
            rrule: "DTSTART;TZID=UTC:20260101T000000 RRULE:FREQ=HOURLY;INTERVAL=1"
            enabled: true

    - name: Build dispatcher role list
      ansible.builtin.set_fact:
        __bootstrap_dispatcher_roles: "{{ __base + __creds + __rest }}"
      vars:
        __base:
          - role: controller_credential_types
            var: controller_credential_types
            tags: [credential_types, controller_credential_types]
        __creds: "{{ [{'role': 'controller_credentials', 'var': 'controller_credentials', 'tags': ['credentials', 'controller_credentials']}] if (controller_credentials is defined) else [] }}"
        __rest:
          - role: controller_inventories
            var: controller_inventories
            tags: [inventories, controller_inventories]
          - role: controller_hosts
            var: controller_hosts
            tags: [hosts, controller_hosts]
          - role: controller_projects
            var: controller_projects
            tags: [projects, controller_projects]
          - role: controller_job_templates
            var: controller_templates
            tags: [job_templates, controller_job_templates]
          - role: controller_schedules
            var: controller_schedules
            tags: [schedules, controller_schedules]

    - name: Dispatch Global Executor runner objects
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
      vars:
        aap_configuration_dispatcher_roles: "{{ __bootstrap_dispatcher_roles }}"

    - name: Show created runner objects
      ansible.builtin.debug:
        msg:
          organization: "{{ ge_organization }}"
          ldap_credential_type: "{{ ge_ldap_credential_type }}"
          ldap_credential: "{{ ge_ldap_credential if (controller_credentials is defined) else '(create manually in UI)' }}"
          inventory: "{{ ge_inventory_name }}"
          project: "{{ ge_project_name }}"
          project_scm_url: "{{ project_scm_url }}"
          vault_credential: "{{ ge_vault_credential }}"
          aap_api_credential: "{{ ge_aap_api_credential }}"
          execution_environment: "{{ ge_execution_environment }}"
          job_template: "{{ ge_job_template_name }}"
          schedule: "{{ ge_schedule_name }} (hourly)"
          note: "Set JT env GE_EXECUTOR_USERS=user1,user2 (or extra var ge_executor_users)"
