---
# Bootstrap AAP objects so sync_marker_team_roles.yml can run on the platform
# (inventory, public Git project, job template, hourly schedule).
#
# Secrets: copy vars/secrets.yml.example → vars/secrets.yml, fill values, encrypt with
# ansible-vault (vars/secrets.yml is gitignored). Job template attaches:
#   - Vault credential → decrypt vars/secrets.yml
#   - AAP API credential → CONTROLLER_* for platform API calls

- name: Bootstrap AAP runner for Global Executor role sync
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/secrets.yml

  vars:
    # --- Object names / placement ---
    ge_organization: "Global Operations"
    ge_inventory_name: "Global Executor Inventory"
    ge_project_name: "Global Executor"
    ge_job_template_name: "Sync Marker Team Roles"
    ge_schedule_name: "Sync Marker Team Roles hourly"
    ge_playbook: "sync_marker_team_roles.yml"

    # Public GitHub repo — no Source Control credential required
    project_scm_url: "https://github.com/automationiberia/aap-global-executor.git"
    project_scm_branch: "main"

    # Existing AAP credentials
    ge_vault_credential: "demo vault credential"
    ge_aap_api_credential: "aap26gw1.bcnconsulting.com"

    # Connection from vars/secrets.yml (ansible-vault)
    aap_hostname: "{{ vault_aap_hostname }}"
    aap_username: "{{ vault_aap_username }}"
    aap_password: "{{ vault_aap_password }}"
    aap_validate_certs: "{{ vault_aap_validate_certs }}"
    gateway_hostname: "{{ aap_hostname }}"
    gateway_username: "{{ aap_username }}"
    gateway_password: "{{ aap_password }}"
    gateway_validate_certs: "{{ aap_validate_certs }}"
    aap_configuration_async_dir: /tmp/ansible-async-ge

  tasks:
    - name: Define inventory in memory
      ansible.builtin.set_fact:
        controller_inventories:
          - name: "{{ ge_inventory_name }}"
            organization: "{{ ge_organization }}"
            description: "Local inventory used to run Global Executor sync jobs"

    - name: Define localhost host in memory
      ansible.builtin.set_fact:
        controller_hosts:
          - name: localhost
            inventory: "{{ ge_inventory_name }}"
            description: "Control node target for API-only Global Executor playbooks"
            variables:
              ansible_connection: local
              ansible_python_interpreter: "{{ '{{' }} ansible_playbook_python {{ '}}' }}"

    - name: Define project in memory
      ansible.builtin.set_fact:
        controller_projects:
          - name: "{{ ge_project_name }}"
            description: "Source for {{ ge_playbook }} (public GitHub repo)"
            organization: "{{ ge_organization }}"
            scm_type: git
            scm_url: "{{ project_scm_url }}"
            scm_branch: "{{ project_scm_branch }}"
            scm_clean: true
            scm_delete_on_update: false
            scm_update_on_launch: true
            scm_update_cache_timeout: 0
            allow_override: true
            update_project: true

    - name: Define job template in memory
      ansible.builtin.set_fact:
        controller_templates:
          - name: "{{ ge_job_template_name }}"
            description: "Sync Organization Execute for marker-team members across all organizations"
            organization: "{{ ge_organization }}"
            project: "{{ ge_project_name }}"
            playbook: "{{ ge_playbook }}"
            inventory: "{{ ge_inventory_name }}"
            credentials:
              - "{{ ge_vault_credential }}"
              - "{{ ge_aap_api_credential }}"
            job_type: run
            ask_credential_on_launch: false
            ask_inventory_on_launch: false
            ask_variables_on_launch: false
            verbosity: 0

    - name: Define hourly schedule in memory
      ansible.builtin.set_fact:
        controller_schedules:
          - name: "{{ ge_schedule_name }}"
            description: "Run Sync Marker Team Roles every hour"
            unified_job_template: "{{ ge_job_template_name }}"
            rrule: "DTSTART;TZID=Europe/Madrid:20260922T000000 RRULE:FREQ=HOURLY;INTERVAL=1"
            enabled: true

    - name: Dispatch Global Executor runner objects
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
      vars:
        aap_configuration_dispatcher_roles:
          - role: controller_inventories
            var: controller_inventories
            tags: [inventories, controller_inventories]
          - role: controller_hosts
            var: controller_hosts
            tags: [hosts, controller_hosts]
          - role: controller_projects
            var: controller_projects
            tags: [projects, controller_projects]
          - role: controller_job_templates
            var: controller_templates
            tags: [job_templates, controller_job_templates]
          - role: controller_schedules
            var: controller_schedules
            tags: [schedules, controller_schedules]

    - name: Show created runner objects
      ansible.builtin.debug:
        msg:
          organization: "{{ ge_organization }}"
          inventory: "{{ ge_inventory_name }}"
          project: "{{ ge_project_name }}"
          project_scm_url: "{{ project_scm_url }}"
          vault_credential: "{{ ge_vault_credential }}"
          aap_api_credential: "{{ ge_aap_api_credential }}"
          job_template: "{{ ge_job_template_name }}"
          schedule: "{{ ge_schedule_name }} (hourly)"
