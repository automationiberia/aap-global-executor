---
# Ensure a marker team + authenticator map exist, then sync the
# "Organization Execute" role for every marker-team member across all orgs.
#
# Pattern: filetree_create / filetree_read (export current AAP state) +
# infra.aap_configuration.dispatch (apply desired state). Team, authenticator
# map, and role-sync payloads are built in-memory with set_fact.

- name: Manage marker team, authenticator map, and dynamic role sync on AAP
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/secrets.yml

  vars:
    # --- Configurable inputs ---
    marker_team_name: "Cross Executors"
    marker_team_org: "Global Operations"
    target_role: "Organization Execute"
    team_member_role: "Team Member"

    marker_map_name: "Cross Executors membership"
    marker_map_authenticator: "AD LDAP"
    # Override on the Job Template (Extra Variables) or with -e:
    #   marker_ldap_group_cn: "CN=mygroup,CN=Users,DC=example,DC=com"
    marker_ldap_group_cn: "CN=cross-executors,CN=Users,DC=example,DC=com"
    marker_map_triggers:
      groups:
        has_or:
          - "{{ marker_ldap_group_cn }}"

    # Temp dir for filetree_create export only (internal vars use "__" prefix)
    __tmp_dir_export: "/tmp/aap_filetree_export"

    # Connection: prefer CONTROLLER_* injected by an AAP credential when the job
    # runs on the platform; otherwise use vars/secrets.yml (ansible-vault).
    __env_controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
    __env_controller_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    __env_controller_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    __env_controller_verify: "{{ lookup('ansible.builtin.env', 'CONTROLLER_VERIFY_SSL') }}"

    __aap_hostname_raw: "{{ ((__env_controller_host | length > 0) | ternary(__env_controller_host, vault_aap_hostname)) | regex_replace('/$', '') }}"
    # gateway_api / filetree_create expect a URL scheme
    aap_hostname: "{{ (__aap_hostname_raw is match('^https?://')) | ternary(__aap_hostname_raw, 'https://' ~ __aap_hostname_raw) }}"
    aap_username: "{{ (__env_controller_username | length > 0) | ternary(__env_controller_username, vault_aap_username) }}"
    aap_password: "{{ (__env_controller_password | length > 0) | ternary(__env_controller_password, vault_aap_password) }}"
    aap_validate_certs: "{{ ((__env_controller_verify | length > 0) | ternary(__env_controller_verify, vault_aap_validate_certs)) | bool }}"
    gateway_hostname: "{{ aap_hostname }}"
    gateway_username: "{{ aap_username }}"
    gateway_password: "{{ aap_password }}"
    gateway_validate_certs: "{{ aap_validate_certs }}"

  tasks:
    # -------------------------------------------------------------------------
    # 0. Auth + export working directory
    # -------------------------------------------------------------------------
    - name: Show Gateway connection target (no secrets)
      ansible.builtin.debug:
        msg:
          aap_hostname: "{{ aap_hostname }}"
          aap_username: "{{ aap_username }}"
          aap_validate_certs: "{{ aap_validate_certs }}"
          using_controller_env: "{{ __env_controller_host | length > 0 }}"

    - name: Obtain OAuth token for filetree_create
      ansible.platform.token:
        description: "Token for marker team role sync"
        scope: write
        state: present
        aap_hostname: "{{ aap_hostname }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: "{{ aap_validate_certs }}"

    - name: Expose OAuth token string for filetree_create gateway_api lookups
      ansible.builtin.set_fact:
        # Plain string — filetree_create accepts aap_token or aap_oauthtoken
        aap_token: "{{ (ansible_facts['aap_token'] is mapping) | ternary(ansible_facts['aap_token'].token, ansible_facts['aap_token']) }}"
        aap_oauthtoken: "{{ (ansible_facts['aap_token'] is mapping) | ternary(ansible_facts['aap_token'].token, ansible_facts['aap_token']) }}"

    - name: Patch ansible.platform retryable bug before filetree_create
      ansible.builtin.include_tasks: tasks/patch_ansible_platform_retryable.yml

    - name: Recreate export working directory
      ansible.builtin.file:
        path: "{{ __tmp_dir_export }}"
        state: "{{ __tmp_state }}"
        mode: "0755"
      loop:
        - absent
        - directory
      loop_control:
        loop_var: __tmp_state
      changed_when: false

    # -------------------------------------------------------------------------
    # 1. Ensure marker team + authenticator map (in-memory vars + dispatch)
    # -------------------------------------------------------------------------
    - name: Define marker team in memory
      ansible.builtin.set_fact:
        aap_teams:
          - name: "{{ marker_team_name }}"
            organization: "{{ marker_team_org }}"
            description: "Marker team for automatic global execution role sync"

    - name: Define authenticator map in memory
      ansible.builtin.set_fact:
        gateway_authenticator_maps:
          - name: "{{ marker_map_name }}"
            authenticator: "{{ marker_map_authenticator }}"
            map_type: team
            role: "{{ team_member_role }}"
            organization: "{{ marker_team_org }}"
            team: "{{ marker_team_name }}"
            revoke: true
            triggers: "{{ marker_map_triggers }}"

    - name: Dispatch marker team and authenticator map creation
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
      vars:
        aap_configuration_dispatcher_roles:
          - role: gateway_teams
            var: aap_teams
            tags: [teams, gateway_teams]
          - role: gateway_authenticator_maps
            var: gateway_authenticator_maps
            tags: [authenticator_maps, gateway_authenticator_maps]

    # -------------------------------------------------------------------------
    # 2. Read current organizations and role assignments (filetree_create)
    # -------------------------------------------------------------------------
    - name: Export organizations and role user assignments from AAP
      ansible.builtin.import_role:
        name: infra.aap_configuration_extended.filetree_create
      vars:
        output_path: "{{ __tmp_dir_export }}"
        omit_id: true
        input_tag:
          - gateway_organizations
          - gateway_role_user_assignments

    - name: Load exported state with filetree_read
      ansible.builtin.import_role:
        name: infra.aap_configuration_extended.filetree_read
      vars:
        dir_orgs_vars: "{{ __tmp_dir_export }}"
        controller_configuration_filetree_read_layout: create

    - name: Store exported data in internal variables
      ansible.builtin.set_fact:
        __all_organizations: "{{ aap_organizations | default(gateway_organizations | default([])) }}"
        __all_role_user_assignments: "{{ gateway_role_user_assignments | default([]) }}"

    # -------------------------------------------------------------------------
    # 3. Extract current marker team members
    # -------------------------------------------------------------------------
    - name: Collect marker team member usernames (Team Member assignments)
      ansible.builtin.set_fact:
        __marker_team_members: "{{ __all_role_user_assignments
          | selectattr('role_definition', 'equalto', team_member_role)
          | selectattr('object_ids', 'contains', marker_team_name)
          | map(attribute='user')
          | list
          | unique }}"

    - name: Show detected marker team members
      ansible.builtin.debug:
        var: __marker_team_members

    # -------------------------------------------------------------------------
    # 4. Compute desired assignments vs assignments to revoke
    # -------------------------------------------------------------------------
    - name: Initialize sync lists
      ansible.builtin.set_fact:
        __org_names: "{{ __all_organizations | map(attribute='name') | list }}"
        __desired_roles: []

    - name: Build desired assignments (user x organization)
      ansible.builtin.set_fact:
        __desired_roles: "{{ __desired_roles + [__assignment] }}"
      loop: "{{ __marker_team_members | product(__org_names) | list }}"
      loop_control:
        loop_var: __pair
      vars:
        __assignment:
          role_definition: "{{ target_role }}"
          user: "{{ __pair.0 }}"
          object_ids:
            - "{{ __pair.1 }}"
          state: present

    - name: Compute assignments to revoke (users no longer in the marker team)
      ansible.builtin.set_fact:
        __roles_to_revoke: "{{ __all_role_user_assignments
          | selectattr('role_definition', 'equalto', target_role)
          | rejectattr('user', 'in', __marker_team_members)
          | map('combine', {'state': 'absent'})
          | list }}"

    - name: Index existing target-role assignment keys (user::organization)
      ansible.builtin.set_fact:
        __existing_target_keys: "{{ __existing_target_keys | default([]) + [__key] }}"
      loop: "{{ __all_role_user_assignments | selectattr('role_definition', 'equalto', target_role) | list }}"
      loop_control:
        loop_var: __existing
        label: "{{ __existing.user | default('?') }} / {{ __existing.object_ids | default([undefined]) | first }}"
      vars:
        __key: "{{ __existing.user }}::{{ __existing.object_ids | first }}"

    - name: Ensure existing-key index is defined when none exist yet
      ansible.builtin.set_fact:
        __existing_target_keys: []
      when: __existing_target_keys is not defined

    - name: Keep only desired assignments missing from the exported state
      ansible.builtin.set_fact:
        __roles_to_create: "{{ __roles_to_create | default([]) + [__desired] }}"
      loop: "{{ __desired_roles }}"
      loop_control:
        loop_var: __desired
        label: "{{ __desired.user }} / {{ __desired.object_ids | first }}"
      when: "(__desired.user ~ '::' ~ (__desired.object_ids | first)) not in __existing_target_keys"

    - name: Ensure create list is defined when everything is already in sync
      ansible.builtin.set_fact:
        __roles_to_create: []
      when: __roles_to_create is not defined

    # -------------------------------------------------------------------------
    # 5. Apply present + absent role assignments (in-memory + dispatch)
    # -------------------------------------------------------------------------
    - name: Define role sync payload (delta only)
      ansible.builtin.set_fact:
        gateway_role_user_assignments: "{{ __roles_to_create + __roles_to_revoke }}"

    - name: Show role sync delta
      ansible.builtin.debug:
        msg:
          marker_members: "{{ __marker_team_members | length }}"
          organizations: "{{ __org_names | length }}"
          desired_total: "{{ __desired_roles | length }}"
          already_present: "{{ (__desired_roles | length) - (__roles_to_create | length) }}"
          to_create: "{{ __roles_to_create | length }}"
          to_revoke: "{{ __roles_to_revoke | length }}"
          dispatch_items: "{{ gateway_role_user_assignments | length }}"

    - name: Apply and purge role assignments via dispatch
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
      vars:
        aap_configuration_dispatcher_roles:
          - role: gateway_role_user_assignments
            var: gateway_role_user_assignments
            tags: [role_user_assignments, gateway_role_user_assignments]
      when: (gateway_role_user_assignments | length) > 0

    - name: Skip dispatch when exported state already matches desired
      ansible.builtin.debug:
        msg: "No role assignment changes required; skipping gateway_role_user_assignments dispatch."
      when: (gateway_role_user_assignments | length) == 0

    - name: Remove export working directory
      ansible.builtin.file:
        path: "{{ __tmp_dir_export }}"
        state: absent
      changed_when: false
