---
# Ensure a marker team + authenticator map exist, then sync the
# "Organization Execute" role for every marker-team member across all orgs.
#
# Reads use ansible.builtin.uri against the Gateway API (filetree_create /
# ansible.platform.gateway_api lookup is unreliable inside many EEs — it often
# surfaces as "'PlatformError' object has no attribute 'retryable'").
# Writes use infra.aap_configuration.dispatch with in-memory set_fact payloads.

- name: Manage marker team, authenticator map, and dynamic role sync on AAP
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/secrets.yml

  vars:
    # --- Configurable inputs ---
    marker_team_name: "Cross Executors"
    marker_team_org: "Global Operations"
    target_role: "Organization Execute"
    team_member_role: "Team Member"

    marker_map_name: "Cross Executors membership"
    marker_map_authenticator: "AD LDAP"
    marker_map_triggers:
      groups:
        has_or:
          - CN=crossexecutors,CN=Users,DC=win,DC=iam,DC=lab

    __api_page_size: 10000

    # Connection: prefer CONTROLLER_* injected by an AAP credential when the job
    # runs on the platform; otherwise use vars/secrets.yml (ansible-vault).
    __env_controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
    __env_controller_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    __env_controller_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    __env_controller_verify: "{{ lookup('ansible.builtin.env', 'CONTROLLER_VERIFY_SSL') }}"

    aap_hostname: "{{ (__env_controller_host | length > 0) | ternary(__env_controller_host, vault_aap_hostname) }}"
    aap_username: "{{ (__env_controller_username | length > 0) | ternary(__env_controller_username, vault_aap_username) }}"
    aap_password: "{{ (__env_controller_password | length > 0) | ternary(__env_controller_password, vault_aap_password) }}"
    aap_validate_certs: "{{ ((__env_controller_verify | length > 0) | ternary(__env_controller_verify, vault_aap_validate_certs)) | bool }}"
    aap_base_url: "{{ (aap_hostname is match('^https?://')) | ternary(aap_hostname, 'https://' ~ aap_hostname) | regex_replace('/$', '') }}"
    gateway_hostname: "{{ aap_hostname }}"
    gateway_username: "{{ aap_username }}"
    gateway_password: "{{ aap_password }}"
    gateway_validate_certs: "{{ aap_validate_certs }}"

  tasks:
    # -------------------------------------------------------------------------
    # 0. Auth
    # -------------------------------------------------------------------------
    - name: Show Gateway connection target (no secrets)
      ansible.builtin.debug:
        msg:
          aap_base_url: "{{ aap_base_url }}"
          aap_username: "{{ aap_username }}"
          aap_validate_certs: "{{ aap_validate_certs }}"
          using_controller_env: "{{ __env_controller_host | length > 0 }}"

    - name: Obtain OAuth token for Gateway API
      ansible.platform.token:
        description: "Token for marker team role sync"
        scope: write
        state: present
        aap_hostname: "{{ aap_hostname }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: "{{ aap_validate_certs }}"

    - name: Expose aap_token for modules and URI calls
      ansible.builtin.set_fact:
        aap_token: "{{ ansible_facts['aap_token'] }}"
        __oauth_token: "{{ (ansible_facts['aap_token'] is mapping) | ternary(ansible_facts['aap_token'].token, ansible_facts['aap_token']) }}"

    # -------------------------------------------------------------------------
    # 1. Ensure marker team + authenticator map (in-memory vars + dispatch)
    # -------------------------------------------------------------------------
    - name: Define marker team in memory
      ansible.builtin.set_fact:
        aap_teams:
          - name: "{{ marker_team_name }}"
            organization: "{{ marker_team_org }}"
            description: "Marker team for automatic global execution role sync"

    - name: Define authenticator map in memory
      ansible.builtin.set_fact:
        gateway_authenticator_maps:
          - name: "{{ marker_map_name }}"
            authenticator: "{{ marker_map_authenticator }}"
            map_type: team
            role: "{{ team_member_role }}"
            organization: "{{ marker_team_org }}"
            team: "{{ marker_team_name }}"
            revoke: true
            triggers: "{{ marker_map_triggers }}"

    - name: Dispatch marker team and authenticator map creation
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
      vars:
        aap_configuration_dispatcher_roles:
          - role: gateway_teams
            var: aap_teams
            tags: [teams, gateway_teams]
          - role: gateway_authenticator_maps
            var: gateway_authenticator_maps
            tags: [authenticator_maps, gateway_authenticator_maps]

    # -------------------------------------------------------------------------
    # 2. Read current organizations and role assignments (Gateway REST)
    # -------------------------------------------------------------------------
    - name: Fetch organizations from Gateway API
      ansible.builtin.uri:
        url: "{{ aap_base_url }}/api/gateway/v1/organizations/?page_size={{ __api_page_size }}&order_by=id"
        method: GET
        headers:
          Authorization: "Bearer {{ __oauth_token }}"
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 200
        return_content: true
      register: __orgs_resp
      no_log: true

    - name: Fetch role user assignments from Gateway API
      ansible.builtin.uri:
        url: "{{ aap_base_url }}/api/gateway/v1/role_user_assignments/?page_size={{ __api_page_size }}&order_by=id"
        method: GET
        headers:
          Authorization: "Bearer {{ __oauth_token }}"
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 200
        return_content: true
      register: __rua_resp
      no_log: true

    - name: Ensure API pages were not truncated
      ansible.builtin.assert:
        that:
          - (__orgs_resp.json.next | default(none)) is none
          - (__rua_resp.json.next | default(none)) is none
        fail_msg: >-
          Gateway returned a next-page link; raise __api_page_size (currently
          {{ __api_page_size }}) so the full inventory fits in one request.

    - name: Initialize normalized export lists
      ansible.builtin.set_fact:
        __all_organizations: []
        __all_role_user_assignments: []

    - name: Store organizations as name objects
      ansible.builtin.set_fact:
        __all_organizations: "{{ __all_organizations + [{'name': __org_item.name}] }}"
      loop: "{{ __orgs_resp.json.results | default([]) }}"
      loop_control:
        loop_var: __org_item
        label: "{{ __org_item.name }}"

    - name: Store role user assignments in dispatch-compatible shape
      ansible.builtin.set_fact:
        __all_role_user_assignments: "{{ __all_role_user_assignments + [__assignment] }}"
      loop: "{{ __rua_resp.json.results | default([]) }}"
      loop_control:
        loop_var: __rua
        label: "{{ __rua.summary_fields.role_definition.name | default('?') }} / {{ __rua.summary_fields.user.username | default('?') }}"
      when:
        # Gateway exposes the target as summary_fields.content_object (not .resource)
        - __rua.summary_fields.role_definition.name | default('') is not match('^galaxy\\.')
        - __rua.summary_fields.user.username is defined
        - (__rua.summary_fields.content_object.name | default('') | length) > 0
      vars:
        __assignment:
          role_definition: "{{ __rua.summary_fields.role_definition.name }}"
          user: "{{ __rua.summary_fields.user.username }}"
          object_ids:
            - "{{ __rua.summary_fields.content_object.name }}"

    # -------------------------------------------------------------------------
    # 3. Extract current marker team members
    # -------------------------------------------------------------------------
    - name: Collect marker team member usernames (Team Member assignments)
      ansible.builtin.set_fact:
        __marker_team_members: "{{ __all_role_user_assignments | default([])
          | selectattr('role_definition', 'equalto', team_member_role)
          | selectattr('object_ids', 'contains', marker_team_name)
          | map(attribute='user')
          | list
          | unique }}"

    - name: Show detected marker team members
      ansible.builtin.debug:
        var: __marker_team_members

    # -------------------------------------------------------------------------
    # 4. Compute desired assignments vs assignments to revoke
    # -------------------------------------------------------------------------
    - name: Initialize sync lists
      ansible.builtin.set_fact:
        __org_names: "{{ __all_organizations | map(attribute='name') | list }}"
        __desired_roles: []

    - name: Build desired assignments (user x organization)
      ansible.builtin.set_fact:
        __desired_roles: "{{ __desired_roles + [__assignment] }}"
      loop: "{{ __marker_team_members | product(__org_names) | list }}"
      loop_control:
        loop_var: __pair
      vars:
        __assignment:
          role_definition: "{{ target_role }}"
          user: "{{ __pair.0 }}"
          object_ids:
            - "{{ __pair.1 }}"
          state: present

    - name: Compute assignments to revoke (users no longer in the marker team)
      ansible.builtin.set_fact:
        __roles_to_revoke: "{{ __all_role_user_assignments | default([])
          | selectattr('role_definition', 'equalto', target_role)
          | rejectattr('user', 'in', __marker_team_members)
          | map('combine', {'state': 'absent'})
          | list }}"

    # -------------------------------------------------------------------------
    # 5. Apply present + absent role assignments (in-memory + dispatch)
    # -------------------------------------------------------------------------
    - name: Define role sync payload in memory
      ansible.builtin.set_fact:
        gateway_role_user_assignments: "{{ __desired_roles + __roles_to_revoke }}"

    - name: Apply and purge role assignments via dispatch
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
      vars:
        aap_configuration_dispatcher_roles:
          - role: gateway_role_user_assignments
            var: gateway_role_user_assignments
            tags: [role_user_assignments, gateway_role_user_assignments]
