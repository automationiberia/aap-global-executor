---
# Sync Organization Execute across all orgs for a fixed executor user list,
# validated against Active Directory (exists, not disabled, password not expired).
#
# User list: env GE_EXECUTOR_USERS (comma-separated) or extra var ge_executor_users.
# LDAP bind: env GE_LDAP_* (from custom credential) or vault_ldap_* in secrets.yml.
#
# Pattern: filetree_create/read for AAP export + AD ldap_search + dispatch delta.

- name: Sync Organization Execute for AD-validated executor users
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/secrets.yml

  vars:
    target_role: "Organization Execute"

    # Comma-separated usernames; prefer env on the Job Template / runtime
    ge_executor_users: ""

    __tmp_dir_export: "/tmp/aap_filetree_export"

    __env_executor_users: "{{ lookup('ansible.builtin.env', 'GE_EXECUTOR_USERS') }}"
    __env_ldap_server: "{{ lookup('ansible.builtin.env', 'GE_LDAP_SERVER') }}"
    __env_ldap_bind_dn: "{{ lookup('ansible.builtin.env', 'GE_LDAP_BIND_DN') }}"
    __env_ldap_bind_password: "{{ lookup('ansible.builtin.env', 'GE_LDAP_BIND_PASSWORD') }}"
    __env_ldap_search_base: "{{ lookup('ansible.builtin.env', 'GE_LDAP_SEARCH_BASE') }}"
    __env_ldap_validate_certs: "{{ lookup('ansible.builtin.env', 'GE_LDAP_VALIDATE_CERTS') }}"

    __users_raw: "{{ (__env_executor_users | length > 0) | ternary(__env_executor_users, ge_executor_users) }}"
    ge_executor_user_list: "{{ __users_raw.split(',') | map('trim') | reject('equalto', '') | list }}"

    # python-ldap requires a scheme; accept bare host/IP from credentials
    __ldap_server_raw: "{{ (__env_ldap_server | length > 0) | ternary(__env_ldap_server, vault_ldap_server | default('')) }}"
    __ldap_server: "{{ (__ldap_server_raw is match('^\\w+://')) | ternary(__ldap_server_raw, 'ldap://' ~ __ldap_server_raw) }}"
    __ldap_bind_dn: "{{ (__env_ldap_bind_dn | length > 0) | ternary(__env_ldap_bind_dn, vault_ldap_bind_dn | default('')) }}"
    __ldap_bind_password: "{{ (__env_ldap_bind_password | length > 0) | ternary(__env_ldap_bind_password, vault_ldap_bind_password | default('')) }}"
    __ldap_search_base: "{{ (__env_ldap_search_base | length > 0) | ternary(__env_ldap_search_base, vault_ldap_search_base | default('')) }}"
    # Validate-certs flag for the AD script (only meaningful for ldaps://).
    # Keep this stringly-typed: boolean env/extra-var injectors from AAP have
    # caused "| length" / "| bool" templating TypeErrors in the EE.
    __ldap_validate_certs: >-
      {{
        true
        if ((__env_ldap_validate_certs | default('') | string | lower) in ['1', 'true', 'yes'])
        else (
          true
          if ((vault_ldap_validate_certs | default(false) | string | lower) in ['1', 'true', 'yes'])
          else false
        )
      }}

    # AAP API connection
    __env_controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
    __env_controller_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
    __env_controller_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
    __env_controller_verify: "{{ lookup('ansible.builtin.env', 'CONTROLLER_VERIFY_SSL') }}"

    __aap_hostname_raw: "{{ ((__env_controller_host | length > 0) | ternary(__env_controller_host, vault_aap_hostname)) | regex_replace('/$', '') }}"
    aap_hostname: "{{ (__aap_hostname_raw is match('^https?://')) | ternary(__aap_hostname_raw, 'https://' ~ __aap_hostname_raw) }}"
    aap_username: "{{ (__env_controller_username | length > 0) | ternary(__env_controller_username, vault_aap_username) }}"
    aap_password: "{{ (__env_controller_password | length > 0) | ternary(__env_controller_password, vault_aap_password) }}"
    aap_validate_certs: "{{ ((__env_controller_verify | length > 0) | ternary(__env_controller_verify, vault_aap_validate_certs)) | bool }}"
    gateway_hostname: "{{ aap_hostname }}"
    gateway_username: "{{ aap_username }}"
    gateway_password: "{{ aap_password }}"
    gateway_validate_certs: "{{ aap_validate_certs }}"

  tasks:
    - name: Require executor user list
      ansible.builtin.assert:
        that:
          - (ge_executor_user_list | length) > 0
        fail_msg: >-
          Set GE_EXECUTOR_USERS (env) or ge_executor_users (extra var) to a
          comma-separated list of usernames.

    - name: Require LDAP connection settings
      ansible.builtin.assert:
        that:
          - (__ldap_server | length) > 0
          - (__ldap_bind_dn | length) > 0
          - (__ldap_bind_password | length) > 0
          - (__ldap_search_base | length) > 0
        fail_msg: >-
          LDAP settings missing. Attach the "LDAP Active Directory" credential
          (injects GE_LDAP_*) or set vault_ldap_* in vars/secrets.yml.

    - name: Show sync inputs (no secrets)
      ansible.builtin.debug:
        msg:
          aap_hostname: "{{ aap_hostname }}"
          ldap_server: "{{ __ldap_server }}"
          ldap_search_base: "{{ __ldap_search_base }}"
          executor_users: "{{ ge_executor_user_list }}"
          using_controller_env: "{{ __env_controller_host | length > 0 }}"
          using_ldap_env: "{{ __env_ldap_server | length > 0 }}"

    # -------------------------------------------------------------------------
    # 0. AAP auth + export dir
    # -------------------------------------------------------------------------
    - name: Obtain OAuth token for filetree_create
      ansible.platform.token:
        description: "Token for executor role sync"
        scope: write
        state: present
        aap_hostname: "{{ aap_hostname }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: "{{ aap_validate_certs }}"

    - name: Expose OAuth token string for filetree_create
      ansible.builtin.set_fact:
        aap_token: "{{ (ansible_facts['aap_token'] is mapping) | ternary(ansible_facts['aap_token'].token, ansible_facts['aap_token']) }}"
        aap_oauthtoken: "{{ (ansible_facts['aap_token'] is mapping) | ternary(ansible_facts['aap_token'].token, ansible_facts['aap_token']) }}"

    - name: Patch ansible.platform retryable bug before filetree_create
      ansible.builtin.include_tasks: tasks/patch_ansible_platform_retryable.yml

    - name: Recreate export working directory
      ansible.builtin.file:
        path: "{{ __tmp_dir_export }}"
        state: "{{ __tmp_state }}"
        mode: "0755"
      loop:
        - absent
        - directory
      loop_control:
        loop_var: __tmp_state
      changed_when: false

    # -------------------------------------------------------------------------
    # 1. Validate each listed user against Active Directory
    # -------------------------------------------------------------------------
    - name: Initialize AD check results
      ansible.builtin.set_fact:
        __ad_checks: []

    - name: Evaluate each executor user in AD
      ansible.builtin.include_tasks: tasks/evaluate_ad_user.yml
      loop: "{{ ge_executor_user_list }}"
      loop_control:
        loop_var: __candidate_user

    - name: Derive eligible and ineligible usernames
      ansible.builtin.set_fact:
        __eligible_users: "{{ __ad_checks | selectattr('ok') | map(attribute='user') | list }}"
        __ineligible_users: "{{ __ad_checks | rejectattr('ok') | map(attribute='user') | list }}"

    - name: Show AD validation summary
      ansible.builtin.debug:
        msg:
          checks: "{{ __ad_checks }}"
          eligible: "{{ __eligible_users }}"
          ineligible: "{{ __ineligible_users }}"

    # -------------------------------------------------------------------------
    # 2. Export organizations and role assignments from AAP
    # -------------------------------------------------------------------------
    - name: Export organizations, users, and role assignments from AAP
      ansible.builtin.import_role:
        name: infra.aap_configuration_extended.filetree_create
      vars:
        output_path: "{{ __tmp_dir_export }}"
        omit_id: true
        input_tag:
          - gateway_organizations
          - gateway_users
          - gateway_role_user_assignments

    - name: Load exported state with filetree_read
      ansible.builtin.import_role:
        name: infra.aap_configuration_extended.filetree_read
      vars:
        dir_orgs_vars: "{{ __tmp_dir_export }}"
        controller_configuration_filetree_read_layout: create

    - name: Store exported data in internal variables
      ansible.builtin.set_fact:
        __all_organizations: "{{ aap_organizations | default(gateway_organizations | default([])) }}"
        __all_role_user_assignments: "{{ gateway_role_user_assignments | default([]) }}"
        __org_names: "{{ (aap_organizations | default(gateway_organizations | default([]))) | map(attribute='name') | list }}"
        __aap_usernames: "{{ (aap_user_accounts | default(gateway_users | default([]))) | map(attribute='username') | list }}"

    # Users who never logged into AAP are not in Gateway yet; role assign/revoke
    # would fail with "User lookup failed". Skip them until they exist.
    - name: Restrict role sync to listed users that already exist in AAP
      ansible.builtin.set_fact:
        __skipped_absent_from_aap: "{{ ge_executor_user_list | reject('in', __aap_usernames) | list }}"
        __eligible_users: "{{ __eligible_users | select('in', __aap_usernames) | list }}"
        __ineligible_users: "{{ __ineligible_users | select('in', __aap_usernames) | list }}"

    - name: Show AAP presence filter
      ansible.builtin.debug:
        msg:
          skipped_absent_from_aap: "{{ __skipped_absent_from_aap }}"
          eligible_for_roles: "{{ __eligible_users }}"
          ineligible_for_roles: "{{ __ineligible_users }}"

    # -------------------------------------------------------------------------
    # 3. Compute desired creates / revokes (scoped to GE_EXECUTOR_USERS)
    # -------------------------------------------------------------------------
    - name: Initialize desired assignment list
      ansible.builtin.set_fact:
        __desired_roles: []

    - name: Build desired assignments for eligible users (user x organization)
      ansible.builtin.set_fact:
        __desired_roles: "{{ __desired_roles + [__assignment] }}"
      loop: "{{ __eligible_users | product(__org_names) | list }}"
      loop_control:
        loop_var: __pair
      vars:
        __assignment:
          role_definition: "{{ target_role }}"
          user: "{{ __pair.0 }}"
          object_ids:
            - "{{ __pair.1 }}"
          state: present

    - name: Compute revocations for ineligible listed users
      ansible.builtin.set_fact:
        __roles_to_revoke: "{{ __all_role_user_assignments
          | selectattr('role_definition', 'equalto', target_role)
          | selectattr('user', 'in', __ineligible_users)
          | map('combine', {'state': 'absent'})
          | list }}"

    - name: Index existing target-role assignment keys (user::organization)
      ansible.builtin.set_fact:
        __existing_target_keys: "{{ __existing_target_keys | default([]) + [__key] }}"
      loop: "{{ __all_role_user_assignments | selectattr('role_definition', 'equalto', target_role) | list }}"
      loop_control:
        loop_var: __existing
        label: "{{ __existing.user | default('?') }} / {{ __existing.object_ids | default([undefined]) | first }}"
      vars:
        __key: "{{ __existing.user }}::{{ __existing.object_ids | first }}"

    - name: Ensure existing-key index is defined
      ansible.builtin.set_fact:
        __existing_target_keys: []
      when: __existing_target_keys is not defined

    - name: Keep only desired assignments missing from exported state
      ansible.builtin.set_fact:
        __roles_to_create: "{{ __roles_to_create | default([]) + [__desired] }}"
      loop: "{{ __desired_roles }}"
      loop_control:
        loop_var: __desired
        label: "{{ __desired.user }} / {{ __desired.object_ids | first }}"
      when: "(__desired.user ~ '::' ~ (__desired.object_ids | first)) not in __existing_target_keys"

    - name: Ensure create list is defined
      ansible.builtin.set_fact:
        __roles_to_create: []
      when: __roles_to_create is not defined

    # -------------------------------------------------------------------------
    # 4. Apply delta via dispatch
    # -------------------------------------------------------------------------
    - name: Define role sync payload (delta only)
      ansible.builtin.set_fact:
        gateway_role_user_assignments: "{{ __roles_to_create + __roles_to_revoke }}"

    - name: Show role sync delta
      ansible.builtin.debug:
        msg:
          skipped_absent_from_aap: "{{ __skipped_absent_from_aap | length }}"
          eligible_users: "{{ __eligible_users | length }}"
          ineligible_users: "{{ __ineligible_users | length }}"
          organizations: "{{ __org_names | length }}"
          desired_total: "{{ __desired_roles | length }}"
          already_present: "{{ (__desired_roles | length) - (__roles_to_create | length) }}"
          to_create: "{{ __roles_to_create | length }}"
          to_revoke: "{{ __roles_to_revoke | length }}"
          dispatch_items: "{{ gateway_role_user_assignments | length }}"

    - name: Apply and purge role assignments via dispatch
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
      vars:
        aap_configuration_dispatcher_roles:
          - role: gateway_role_user_assignments
            var: gateway_role_user_assignments
            tags: [role_user_assignments, gateway_role_user_assignments]
      when: (gateway_role_user_assignments | length) > 0

    - name: Skip dispatch when no role changes are required
      ansible.builtin.debug:
        msg: "No role assignment changes required; skipping dispatch."
      when: (gateway_role_user_assignments | length) == 0

    - name: Remove export working directory
      ansible.builtin.file:
        path: "{{ __tmp_dir_export }}"
        state: absent
      changed_when: false
...
