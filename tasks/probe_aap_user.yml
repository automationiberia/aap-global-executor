---
# Probe Gateway for each GE_EXECUTOR_USERS candidate. Sets:
#   __aap_usernames            — usernames that exist in AAP
#   __skipped_absent_from_aap  — listed usernames with no Gateway user yet
#
# Avoids filetree_create/read of gateway_users (include_vars can crash on
# exporter YAML: "unsupported operand type(s) for |=: 'bool' and 'str'").

- name: Probe AAP Gateway for listed user {{ __candidate_user }}
  ansible.builtin.uri:
    url: "{{ aap_hostname }}/api/gateway/v1/users/?username={{ __candidate_user | urlencode }}&page_size=10"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_token }}"
    validate_certs: "{{ aap_validate_certs }}"
    status_code: [200]
  register: __aap_user_probe
  changed_when: false
  failed_when: false

- name: Record AAP presence for {{ __candidate_user }}
  ansible.builtin.set_fact:
    __aap_usernames: "{{ __aap_usernames | default([]) + [__candidate_user] }}"
  when:
    - (__aap_user_probe.status | default(0) | int) == 200
    - >
      (
        (__aap_user_probe.json.results | default([]))
        | selectattr('username', 'defined')
        | selectattr('username', 'equalto', __candidate_user)
        | list
        | length
      ) > 0
