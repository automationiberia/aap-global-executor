---
# Evaluate one candidate username against Active Directory via files/eval_ad_account.py
# (python-ldap only; no community.general). Appends to __ad_checks: {user, ok, reason}.

- name: Evaluate AD account for {{ __candidate_user }}
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/files/eval_ad_account.py"
      - --server
      - "{{ __ldap_server }}"
      - --bind-dn
      - "{{ __ldap_bind_dn }}"
      - --bind-password
      - "{{ __ldap_bind_password }}"
      - --search-base
      - "{{ __ldap_search_base }}"
      - --username
      - "{{ __candidate_user }}"
      - --validate-certs
      - "{{ (__ldap_validate_certs | default(false) | bool) | ternary('true', 'false') }}"
  register: __ad_eval_cmd
  changed_when: false
  failed_when: false
  # Password is on argv; keep no_log. Script always exits 0 with JSON on stdout.
  no_log: true

- name: Parse AD evaluation stdout for {{ __candidate_user }}
  ansible.builtin.set_fact:
    __ad_eval_parsed:
      ok: false
      reason: ldap_error
      detail: "{{ (__ad_eval_cmd.stderr | default('empty script output', true)) | truncate(300, true, '...') }}"
  when: (__ad_eval_cmd.stdout | default('') | length) == 0 or not ((__ad_eval_cmd.stdout | trim) is match('\{'))

- name: Parse AD evaluation JSON for {{ __candidate_user }}
  ansible.builtin.set_fact:
    __ad_eval_parsed: "{{ __ad_eval_cmd.stdout | from_json }}"
  when: (__ad_eval_cmd.stdout | default('') | length) > 0 and ((__ad_eval_cmd.stdout | trim) is match('\{'))

- name: Record AD evaluation for {{ __candidate_user }}
  ansible.builtin.set_fact:
    __ad_checks: "{{ __ad_checks | default([]) + [__row] }}"
  vars:
    __row:
      user: "{{ __candidate_user }}"
      ok: "{{ __ad_eval_parsed.ok | default(false) | bool }}"
      reason: "{{ __ad_eval_parsed.reason | default('ldap_error') }}"
      detail: "{{ __ad_eval_parsed.detail | default('') }}"
