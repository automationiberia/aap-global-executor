---
# Evaluate one candidate username against Active Directory via files/eval_ad_account.py
# (python-ldap only; no community.general). Appends to __ad_checks: {user, ok, reason}.
#
# Bind password via env. Result JSON written to a temp file so diagnostics are visible
# without no_log censoring the registered command output.

- name: Evaluate AD account for {{ __candidate_user }}
  vars:
    __ad_out: "/tmp/ge_ad_eval_{{ __candidate_user }}.json"
  block:
    - name: Remove previous AD eval outfile for {{ __candidate_user }}
      ansible.builtin.file:
        path: "{{ __ad_out }}"
        state: absent

    - name: Run AD account eval script for {{ __candidate_user }}
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/eval_ad_account.py"
          - --server
          - "{{ __ldap_server }}"
          - --bind-dn
          - "{{ __ldap_bind_dn }}"
          - --bind-password-env
          - GE_LDAP_BIND_PASSWORD
          - --search-base
          - "{{ __ldap_search_base }}"
          - --username
          - "{{ __candidate_user }}"
          - --validate-certs
          - "{{ 'true' if __ldap_validate_certs else 'false' }}"
          - --outfile
          - "{{ __ad_out }}"
      environment:
        GE_LDAP_BIND_PASSWORD: "{{ __ldap_bind_password }}"
      register: __ad_eval_cmd
      changed_when: false
      failed_when: false
      no_log: true
  rescue:
    - name: Note AD eval block failure for {{ __candidate_user }}
      ansible.builtin.set_fact:
        __ad_eval_block_error: "{{ ansible_failed_result.msg | default('ad eval block failed') | truncate(300, true, '...') }}"

- name: Read AD eval outfile for {{ __candidate_user }}
  ansible.builtin.slurp:
    src: "/tmp/ge_ad_eval_{{ __candidate_user }}.json"
  register: __ad_out_slurp
  failed_when: false

- name: Show AD evaluate diagnostics for {{ __candidate_user }}
  ansible.builtin.debug:
    msg:
      has_outfile: "{{ __ad_out_slurp.content is defined }}"
      block_error: "{{ __ad_eval_block_error | default('') }}"
      raw: "{{ (__ad_out_slurp.content | b64decode) if (__ad_out_slurp.content is defined) else '' }}"

- name: Parse AD evaluation JSON for {{ __candidate_user }}
  ansible.builtin.set_fact:
    __ad_eval_parsed: "{{ __ad_out_slurp.content | b64decode | from_json }}"
  when: __ad_out_slurp.content is defined

- name: Default AD evaluation when outfile missing for {{ __candidate_user }}
  ansible.builtin.set_fact:
    __ad_eval_parsed:
      ok: false
      reason: ldap_error
      detail: "{{ __ad_eval_block_error | default('no eval outfile / empty result') }}"
  when: __ad_out_slurp.content is not defined

- name: Record AD evaluation for {{ __candidate_user }}
  ansible.builtin.set_fact:
    __ad_checks: "{{ __ad_checks | default([]) + [__row] }}"
  vars:
    __row:
      user: "{{ __candidate_user }}"
      ok: "{{ __ad_eval_parsed.ok | default(false) | bool }}"
      reason: "{{ __ad_eval_parsed.reason | default('ldap_error') }}"
      detail: "{{ __ad_eval_parsed.detail | default('') }}"
...
