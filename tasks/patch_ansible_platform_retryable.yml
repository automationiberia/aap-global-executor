---
# Work around ansible.platform bug: base PlatformError lacks `.retryable`, so
# gateway_api lookups (used by filetree_create) can raise
# "'PlatformError' object has no attribute 'retryable'" and hide the real error.
# Patch every ansible.platform copy found on common collection paths (EE + project).

- name: Discover ansible.platform collection roots
  ansible.builtin.stat:
    path: "{{ __candidate }}/plugins/plugin_utils/platform/exceptions.py"
  loop:
    - "{{ lookup('ansible.builtin.env', 'HOME') }}/.ansible/collections/ansible_collections/ansible/platform"
    - /usr/share/ansible/collections/ansible_collections/ansible/platform
    - /runner/requirements_collections/ansible_collections/ansible/platform
    - /runner/dependencies/ansible_collections/ansible/platform
    - /usr/share/automation-controller/collections/ansible_collections/ansible/platform
  loop_control:
    loop_var: __candidate
  register: __ap_candidates

- name: Select writable ansible.platform roots
  ansible.builtin.set_fact:
    __ansible_platform_roots: "{{ __ap_candidates.results
      | selectattr('stat.exists')
      | map(attribute='__candidate')
      | list }}"

- name: Fail when ansible.platform is not installed
  ansible.builtin.assert:
    that:
      - (__ansible_platform_roots | length) > 0
    fail_msg: >-
      ansible.platform not found on collection paths. Install it via
      collections/requirements.yml (>=2.7.20260812) and ensure project
      collection downloads are enabled for the job.

- name: Ensure PlatformError defines retryable (filetree_create / gateway_api)
  ansible.builtin.lineinfile:
    path: "{{ __root }}/plugins/plugin_utils/platform/exceptions.py"
    regexp: '^\s*self\.retryable = False  # base default'
    insertafter: 'self\.details = details or \{\}'
    line: '        self.retryable = False  # base default; subclasses may override'
    state: present
  loop: "{{ __ansible_platform_roots }}"
  loop_control:
    loop_var: __root
  register: __patch_exceptions
  failed_when: false

- name: Soften retry_http_request retryable attribute access
  ansible.builtin.replace:
    path: "{{ __root }}/plugins/plugin_utils/platform/retry.py"
    regexp: 'if platform_error\.retryable and attempt'
    replace: 'if getattr(platform_error, "retryable", False) and attempt'
  loop: "{{ __ansible_platform_roots }}"
  loop_control:
    loop_var: __root
  register: __patch_retry
  failed_when: false

- name: Show ansible.platform patch result
  ansible.builtin.debug:
    msg:
      roots: "{{ __ansible_platform_roots }}"
      exceptions_changes: "{{ __patch_exceptions.results | map(attribute='changed') | list }}"
      retry_changes: "{{ __patch_retry.results | map(attribute='changed') | list }}"
      note: >-
        If roots are read-only (typical baked-in EE path), rebuild the EE with
        ansible.platform >=2.7.20260812 or rely on project collection install
        under /runner/requirements_collections.
...
